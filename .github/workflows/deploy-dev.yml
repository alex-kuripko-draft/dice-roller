name: Deploy dev
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - name: Smoke check static page
        run: |
          test -s src/index.html
          grep -q '<title>Dice Roller</title>' src/index.html
      - name: Record dev deployment
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/record-deployment
        with:
          environment: dev
          sha: ${{ github.sha }}
          state: ${{ job.status == 'success' && 'success' || 'failure' }}
          environment-url: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/src/index.html
          token: ${{ github.token }}
