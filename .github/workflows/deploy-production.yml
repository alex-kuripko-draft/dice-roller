name: Deploy production
# Run only for an owner-authorized release operation, for its exact main SHA.
# Publishes to the root of GitHub Pages, alongside dev at /dev/ (republished
# from its last successful deployment so this run never clobbers it).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-hex commit on main to release
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Validate SHA format
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify commit is on main
        env:
          SHA: ${{ inputs.sha }}
        run: git merge-base --is-ancestor "$SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - id: publish
        uses: ./.github/actions/publish-pages
        with:
          role: production
          sha: ${{ inputs.sha }}
          content-dir: src
          token: ${{ github.token }}
      - name: Smoke check public page
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: curl -fsSL "$PAGE_URL" | grep -q '<title>Dice Roller</title>'
      - name: Record production deployment
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/record-deployment
        with:
          environment: production
          sha: ${{ inputs.sha }}
          state: ${{ job.status == 'success' && 'success' || 'failure' }}
          environment-url: ${{ steps.publish.outputs.page_url }}
          token: ${{ github.token }}
